name: Alarm Robot Saham

on:
  schedule:
    # Alarm berbunyi pukul 16:30 WIB (Senin - Jumat)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: 

jobs:
  bangun-dan-bekerja:
    runs-on: ubuntu-latest
    steps:
      - name: Membuka kamar
        uses: actions/checkout@v3

      - name: Membangunkan otak Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Mengambil alat-alat (yfinance, requests, pembuat grafik)
        run: pip install requests yfinance pandas mplfinance lxml html5lib beautifulsoup4

      - name: Robot mulai mengecek saham!
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        # BAGIAN INI YANG DIREVISI MENJADI bot_saham.py
        run: python bot_saham.py
